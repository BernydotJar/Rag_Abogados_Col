<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Investigación jurídica colombiana basada en evidencia verificable, citas y procedencia de fuentes oficiales.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'; worker-src 'none'">
  <title>Evidencia Jurídica — Colombia</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main" id="skip-link"></a>
  <div id="app-shell">
    <header class="site-header" aria-label="Primary">
      <a class="brand" href="#" id="brand-link"><span class="brand-mark" aria-hidden="true">R</span><span id="brand-name"></span></a>
      <div class="header-meta">
        <span class="demo-badge" id="demo-badge"></span>
        <label class="language-control"><span id="language-label"></span><select id="locale-select"><option value="es">ES</option><option value="en">EN</option><option value="pt">PT</option></select></label>
      </div>
    </header>
    <div class="system-strip"><span class="status-dot" aria-hidden="true"></span><span id="system-status" role="status" aria-live="polite"></span></div>
    <main id="main" tabindex="-1">
      <section id="landing-view" class="landing-view"></section>
      <section id="workspace-view" class="workspace-view" hidden></section>
    </main>
    <footer class="site-footer"><p id="footer-copy"></p></footer>
  </div>
  <dialog id="upload-dialog" class="upload-dialog"></dialog>
  <dialog id="passage-dialog" class="passage-dialog"></dialog>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
